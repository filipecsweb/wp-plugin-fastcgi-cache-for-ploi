name: Deploy readme to WordPress.org

# Publishing readme metadata (Tested up to, description, FAQ) without cutting a
# release: the plugin version, the SVN tags and the shipped ZIP all stay put, so
# installed sites see no update. Deliberate manual run only — the SVN commit is
# public and irreversible.
on:
  workflow_dispatch:

# Shares deploy.yml's group: a readme push and a release push must never hold the
# same SVN working copy at once.
concurrency:
  group: wporg-deploy
  cancel-in-progress: false

jobs:
  deploy-readme:
    name: Deploy readme to WordPress.org
    runs-on: ubuntu-latest
    # The SVN credentials are the wporg environment's secrets, as in deploy.yml.
    environment: wporg
    steps:
      - uses: actions/checkout@v5

      # The directory page renders the readme of the tag named by "Stable tag",
      # not trunk's — the action parses that field and commits to both, which is
      # what lets this land without a new tag.
      - name: Deploy readme.txt to trunk and the stable tag
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          # The GitHub repo name differs from the wp.org slug; without SLUG the
          # action would default to the repo name and hit the wrong SVN URL.
          SLUG: fastcgi-cache-for-ploi
          # SVN trunk holds the built plugin with production dependencies, which
          # a plain source checkout never reproduces. Left unset, asset-update
          # (as of 2480306) compares the whole plugin and aborts unless
          # readme.txt and assets are the only diff, so every run here would fail.
          IGNORE_OTHER_FILES: true
          # Assets belong to the release path; this push carries metadata only.
          # It does not promise an asset-free commit: as of asset-update 2480306
          # the svn:mime-type propsets ignore this flag, so property-only asset
          # entries can ride along (r3669416).
          SKIP_ASSETS: true
